services:
  - type: web
    name: claritiy-voice-server
    region: singapore
    env: node
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /live
    maxShutdownDelaySeconds: 90
    rootDir: server
    # The live service's dashboard Build Command is `npm install; npm run build` (it overrides this
    # file). `npm run build` = prisma generate -> tsc -> scripts/deploy_schema_sync.js, which adds
    # missing tables/columns/indexes (additive only, one transaction, never drops) on Render builds.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: VOBIZ_AUTH_ID
        sync: false
      - key: VOBIZ_AUTH_TOKEN
        sync: false
      - key: VOBIZ_FROM_NUMBER
        sync: false
      - key: VOBIZ_API_URL
        sync: false
      - key: PLIVO_AUTH_ID
        sync: false
      - key: PLIVO_AUTH_TOKEN
        sync: false
      - key: PLIVO_APP_ID
        sync: false
