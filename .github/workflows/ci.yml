name: CI

# Quality gates (CLAUDE.md §8): typecheck + build, the server test chain on a throwaway Postgres,
# and the browser tests. Runs on every pull request and on every push to main.
# Never touches production: the database is the job's own service container and every test script
# loads server/scripts/lib/testDbGuard.cjs, which blanks live keys and refuses non-test databases.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.17.0'

jobs:
  typecheck-build:
    name: Typecheck + build (frontend, admin, server)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install frontend (pnpm, frozen lockfile)
        working-directory: Frontend
        run: pnpm install --frozen-lockfile
      - name: Install admin console
        working-directory: Admin
        run: npm ci
      - name: Install server
        working-directory: server
        run: npm ci
      - name: Generate Prisma client (no database needed)
        working-directory: server
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npx prisma generate
      - name: Typecheck (must be 0 errors, frontend and server)
        run: npm run typecheck
      - name: Build (frontend + admin bundle)
        run: npm run build
      - name: Build server
        working-directory: server
        run: npm run build

  server-tests:
    name: Server test chain (test:security + suites)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # pgvector: the knowledge-base chunks table has a vector(3072) column.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: claritiy_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://ci:ci_test_only@127.0.0.1:5432/claritiy_ci_test?sslmode=disable
      DATABASE_URL: postgresql://ci:ci_test_only@127.0.0.1:5432/claritiy_ci_test?sslmode=disable
      DIRECT_URL: postgresql://ci:ci_test_only@127.0.0.1:5432/claritiy_ci_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server
        working-directory: server
        run: npm ci
      - name: Supabase auth.uid() stub (RLS policies in the baseline call it; Supabase provides it)
        run: PGPASSWORD=ci_test_only psql -h 127.0.0.1 -U ci -d claritiy_ci_test -c "CREATE SCHEMA IF NOT EXISTS auth; CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'select null::uuid';"
      - name: Build the empty CI database from the committed migrations (M0)
        working-directory: server
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Build server
        working-directory: server
        run: npm run build
      - name: test:security (main chain, must be 100%)
        working-directory: server
        run: npm run test:security
      - name: Knowledge-base plan-limit race (real Postgres concurrency)
        working-directory: server
        run: npm run test:kb-race
      - name: OWASP + payment security
        working-directory: server
        run: |
          npm run test:owasp
          npm run test:payment-security
      - name: Batch suites a–f
        working-directory: server
        run: |
          for s in a b c d e f; do npm run test:batch-$s; done
      - name: Pipeline, accuracy and voice suites
        # test:playout measures wall-clock jitter of 20 ms frames and is run locally before each
        # merge instead: shared CI runners are too noisy for a < 5 ms standard-deviation check.
        working-directory: server
        run: |
          npm run test:m1-pipeline
          npm run test:m2-accuracy
          npm run test:street-smart
          npm run test:street-smart-regression
          npm run test:plivo-webhook
          npm run test:audiostream-isolation
          npm run test:live-transcript-auth
          npm run test:prompt-injection
          npm run test:audio
          npm run test:codec
          npm run test:drain
          npm run test:turn
          npm run test:persona

  browser-tests:
    name: Browser tests (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install frontend
        working-directory: Frontend
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: Frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: Frontend
        env:
          CI: 'true'
        run: npx playwright test --workers=2 --reporter=line
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Frontend/test-results
          retention-days: 7

  migration-drift:
    name: Migrations build an empty database with zero drift from schema.prisma (M0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: claritiy_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci_test_only@127.0.0.1:5432/claritiy_migrations?sslmode=disable
      DIRECT_URL: postgresql://ci:ci_test_only@127.0.0.1:5432/claritiy_migrations?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install server
        working-directory: server
        run: npm ci
      - name: Supabase auth.uid() stub
        run: PGPASSWORD=ci_test_only psql -h 127.0.0.1 -U ci -d claritiy_migrations -c "CREATE SCHEMA IF NOT EXISTS auth; CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'select null::uuid';"
      - name: Apply committed migrations to an empty database
        working-directory: server
        run: npx prisma migrate deploy
      - name: Compare the migrated database with schema.prisma
        working-directory: server
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
