name: Trigger Render Deployment

# Calls the Render deploy hook only after the CI workflow has passed on main (typecheck, build,
# server test chain, browser tests). The previous version ran `npm ci` at the repo root and an
# unguarded test that needs a live API and a test database, so it failed on every push.
# Note: if Render's own "auto-deploy on push" is also switched on, Render deploys without waiting
# for CI. To make CI a hard gate, turn auto-deploy off in Render and keep this hook (RUNBOOK).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Trigger Render Webhook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "Triggering Render deploy hook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${RENDER_DEPLOY_HOOK_URL}")
            echo "Render Deploy Hook HTTP Status: ${HTTP_STATUS}"
          else
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret not set in GitHub repository settings."
            echo "To enable deployments from CI, add RENDER_DEPLOY_HOOK_URL to GitHub Secrets."
          fi
