name: Trigger Render Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'render.yaml'
      - '.github/workflows/deploy-render.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Backend Security & Auth Audit
        run: node scripts/test_auth_protection.js

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: Frontend

      - name: Run Frontend E2E Auth Gate Tests
        run: npm run test:e2e
        working-directory: Frontend

      - name: Trigger Render Webhook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "Triggering Render deploy hook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${RENDER_DEPLOY_HOOK_URL}")
            echo "Render Deploy Hook HTTP Status: ${HTTP_STATUS}"
          else
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret not set in GitHub repository settings."
            echo "To enable instant automated deployments on push, add RENDER_DEPLOY_HOOK_URL to GitHub Secrets."
          fi
