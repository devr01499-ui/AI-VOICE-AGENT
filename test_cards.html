<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f5f5f5; padding: 50px; font-family: sans-serif; }
    .card-right {
      border-radius: 0 100px 100px 0;
      box-shadow: 10px 15px 30px rgba(0,0,0,0.15);
    }
    .card-left {
      border-radius: 100px 0 0 100px;
      box-shadow: -10px 15px 30px rgba(0,0,0,0.15);
    }
    .back-shadow {
      box-shadow: 0 20px 40px rgba(0,0,0,0.25) inset, 0 15px 20px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div style="max-width: 800px; margin: 0 auto; position: relative; height: 1000px;">
    
    <!-- 01 FRONT -->
    <div class="card-right" style="position: absolute; top: 0; left: 25%; width: 75%; height: 140px; background: #D9988F; z-index: 10; padding: 20px 40px;">
      <h1 class="text-white text-5xl font-light">01</h1>
      <p class="text-white font-bold mt-2">CONFIGURE YOUR AI AGENT</p>
    </div>
    
    <!-- BACK 1 -->
    <div class="card-right back-shadow" style="position: absolute; top: 70px; left: 25%; width: 60%; height: 140px; background: #6A5E6D; z-index: 9; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 20px;">
      <div class="text-white opacity-50">ICON</div>
    </div>

    <!-- 02 FRONT -->
    <div class="card-left" style="position: absolute; top: 140px; right: 25%; width: 75%; height: 140px; background: #796B7C; z-index: 8; padding: 20px 40px; text-align: right;">
      <h1 class="text-white text-5xl font-light">02</h1>
      <p class="text-white font-bold mt-2">UPLOAD KNOWLEDGE BASE</p>
    </div>

    <!-- BACK 2 -->
    <div class="card-left back-shadow" style="position: absolute; top: 210px; right: 25%; width: 60%; height: 140px; background: #322734; z-index: 7; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 20px;">
      <div class="text-white opacity-50">ICON</div>
    </div>

    <!-- 03 FRONT -->
    <div class="card-right" style="position: absolute; top: 280px; left: 25%; width: 75%; height: 140px; background: #3A2D3C; z-index: 6; padding: 20px 40px;">
      <h1 class="text-white text-5xl font-light">03</h1>
      <p class="text-white font-bold mt-2">CONNECT PHONE NUMBER</p>
    </div>

    <!-- BACK 3 -->
    <div class="card-right back-shadow" style="position: absolute; top: 350px; left: 25%; width: 60%; height: 140px; background: #A43627; z-index: 5; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 20px;">
      <div class="text-white opacity-50">ICON</div>
    </div>

    <!-- 04 FRONT -->
    <div class="card-left" style="position: absolute; top: 420px; right: 25%; width: 75%; height: 140px; background: #C54636; z-index: 4; padding: 20px 40px; text-align: right;">
      <h1 class="text-white text-5xl font-light">04</h1>
      <p class="text-white font-bold mt-2">LAUNCH & MONITOR</p>
    </div>

  </div>
</body>
</html>
