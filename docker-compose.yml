version: '3.8'

# Local container run of the API server. (The drachtio SIP service was removed in Phase 13: the
# generic SIP trunking feature was unreachable; calls use the hosted carriers.)
services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: claritiy-voice-server
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - ./server/.env
    environment:
      - PUBLIC_IP=${PUBLIC_IP:-127.0.0.1}
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${PORT:-3001}
    networks:
      - claritiy-voice-network

networks:
  claritiy-voice-network:
    driver: bridge
