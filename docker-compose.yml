version: '3.8'

services:
  drachtio:
    image: drachtio/drachtio-server:latest
    container_name: claritiy-voice-drachtio
    restart: unless-stopped
    ports:
      - "${SIP_PORT:-5060}:5060/udp"
      - "${SIP_PORT:-5060}:5060/tcp"
      - "9022:9022"
    environment:
      - DRACHTIO_SECRET=${DRACHTIO_SECRET:-cymru}
    # Using entrypoint or command to inject the public IP into contact
    command: >
      drachtio --contact "sip:${PUBLIC_IP:-127.0.0.1}:5060;transport=udp,tcp" 
      --secret "${DRACHTIO_SECRET:-cymru}" 
      --port 9022 
      --loglevel info
    networks:
      - claritiy-voice-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: claritiy-voice-server
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - ./server/.env
    environment:
      - DRACHTIO_HOST=drachtio
      - DRACHTIO_PORT=9022
      - DRACHTIO_SECRET=${DRACHTIO_SECRET:-cymru}
      - PUBLIC_IP=${PUBLIC_IP:-127.0.0.1}
      - SIP_PORT=${SIP_PORT:-5060}
      - DATABASE_URL=${DATABASE_URL}
      - PORT=${PORT:-3001}
    depends_on:
      - drachtio
    networks:
      - claritiy-voice-network

networks:
  claritiy-voice-network:
    driver: bridge
